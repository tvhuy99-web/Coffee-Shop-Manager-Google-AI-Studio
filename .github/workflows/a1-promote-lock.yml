name: A-1 promote verified lock and archive replay evidence
on:
  push:
    branches: ['refactor/football-simulation-4']
    paths:
      - '.github/workflows/a1-promote-lock.yml'
  workflow_dispatch:
permissions: {}
concurrency:
  group: pingfootball-a1-promote-lock
  cancel-in-progress: false
jobs:
  promote:
    if: github.repository == 'tvhuy99-web/Coffee-Shop-Manager-Google-AI-Studio' && github.ref == 'refs/heads/refactor/football-simulation-4'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/football-simulation-4
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          ref: evidence/a1-historical
          path: archive-branch
      - name: Verify CI provenance and original ZIP bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, re, subprocess, zipfile
          from pathlib import Path
          repo = 'tvhuy99-web/Coffee-Shop-Manager-Google-AI-Studio'
          run_id = 45593874053
          baseline = 'c2c392d8b3ccc57985e87337e8994fd7033328ee'
          workflow_commit = '684214fb9947741b8f54a59a48e28aaab1dcc11f'
          lock_hash = '41d521b51131a20781790cb9ee4c62c967f34003866d50d97df2a3354eae9099'
          entries = json.loads(r'''[{"id":15013146336,"name":"a1-parity-full_event","sha256":"e4795b810437b8b2fb561e3a8fe6b41a176beb11ea40278d1aeeb9edafcb2deb","size":4206804},{"id":15013095193,"name":"a1-parity-high_press","sha256":"4d6541eb9fef61bce68e3b28214e6203685929295b6a464e4c5cfbd04058673d","size":240024},{"id":15012956182,"name":"a1-parity-baseline","sha256":"cd775e99f4d79a55baa1ab1e180423197cdd27ff0aa9617abece5a35f2647cea","size":3612960},{"id":15012860159,"name":"a1-locked-inputs","sha256":"ee02a9ba445c9f7dfb7d3de811fd9ced714dab70328c6f2ecc26358b503c73f7","size":46041},{"id":15012711788,"name":"a1-continuation","sha256":"7c39f04e1c5160b16ce34047d2c05ad6f6e5f466089caf1f1f71e95f7aba3b88","size":5066},{"id":15012327798,"name":"a1-parity-balanced","sha256":"36f0f6cf0ee7cfb7f57563f7de21e3bc71aa75da8b2311b602d931ceeac084a9","size":464146},{"id":15012158517,"name":"a1-parity-low_block","sha256":"da66e5715e1ade0ee4007f20efeb2a4e41a53d431db2f755dfa5d2a2581065dd","size":243283},{"id":15012157965,"name":"a1-audit-technical","sha256":"bcb585574e51ddaeab2a7c63be055d3499a561f740217ff91c64388cda0b1404","size":287645},{"id":15012122855,"name":"a1-audit-physical","sha256":"4f8c66101566c021fb93127dfe65d9877a7137641e2f40bb85fc7e36e8251938","size":208896},{"id":15012038621,"name":"a1-audit-hidden","sha256":"6cb96f7a8063f19c2ab65b45947e1f22e2be08162880ab9dbc1fa87528f9526e","size":183235},{"id":15011942868,"name":"a1-audit-mental","sha256":"6c6452743f00db4c8b9cbe853daa07227f3866e889fcc77c5dd3acc0118f8f11","size":353128},{"id":15011839901,"name":"a1-parity-strong_away","sha256":"eab7ca6068c949e7204a0ee89145ce856e54b78b9cd4789178606d80d4e0bac8","size":243406},{"id":15011744319,"name":"a1-audit-goalkeeping","sha256":"bede79d67d107fe76cb05ae8c1931088cf92bdfa4ef3682b2d26c22259f39c79","size":177130},{"id":15011369705,"name":"a1-parity-strong_home","sha256":"6b145e83bd0503ed22373eb90abc65027cd61b8d77c07aac8081a47972f49c51","size":241895}]''')
          run = json.loads(subprocess.check_output(['gh','api',f'/repos/{repo}/actions/runs/{run_id}']))
          assert run['conclusion'] == 'success' and run['head_sha'] == workflow_commit
          assert run['path'] == '.github/workflows/a1-baseline-freeze.yml'
          dest = Path('archive-branch/docs/evidence/a-1/locked-run-45593874053')
          dest.mkdir(parents=True, exist_ok=True)
          rows = []
          lock_bytes = None
          for item in entries:
              path = dest / (item['name'] + '.zip')
              if not path.exists():
                  tmp = path.with_suffix('.tmp')
                  with tmp.open('wb') as f:
                      subprocess.run(['gh','api',f"/repos/{repo}/actions/artifacts/{item['id']}/zip"],stdout=f,check=True)
                  assert hashlib.sha256(tmp.read_bytes()).hexdigest() == item['sha256']
                  tmp.rename(path)
              assert path.stat().st_size == item['size']
              assert hashlib.sha256(path.read_bytes()).hexdigest() == item['sha256']
              with zipfile.ZipFile(path) as z:
                  assert z.testzip() is None
                  assert z.read('commit.txt').decode().strip() == baseline
                  assert hashlib.sha256(z.read('Cargo.lock')).hexdigest() == lock_hash
                  sums = z.read('SHA256SUMS').decode().splitlines()
                  for line in sums:
                      digest, name = line.split('  ', 1)
                      assert re.fullmatch(r'[0-9a-f]{64}',digest)
                      assert hashlib.sha256(z.read(name)).hexdigest() == digest, name
                  if item['name'] == 'a1-locked-inputs':
                      lock_bytes = z.read('Cargo.lock')
                  rows.append({**item, 'member_sha256':{n:hashlib.sha256(z.read(n)).hexdigest() for n in z.namelist() if not n.endswith('/')}})
          assert len(rows) == 14 and lock_bytes is not None
          assert hashlib.sha256(lock_bytes).hexdigest() == lock_hash
          (dest/'verified-manifest.json').write_text(json.dumps({'schema':1,'run_id':run_id,'workflow_commit':workflow_commit,'baseline_sha':baseline,'lock_sha256':lock_hash,'artifacts':rows},indent=2,sort_keys=True)+'\n')
          target = Path('rust/football_match_engine/Cargo.lock')
          if target.exists():
              assert target.read_bytes() == lock_bytes, 'Refusing to overwrite a different lockfile'
          else:
              target.write_bytes(lock_bytes)
          print('Verified 14 ZIP archives and exact candidate lockfile.')
          PY
      - name: Validate exact lock with pinned Rust
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = 'refactor/football-simulation-4'
          git diff --exit-code c2c392d8b3ccc57985e87337e8994fd7033328ee -- rust/football_match_engine/Cargo.toml rust/football_match_engine/src
          rustup toolchain install 1.100.0 --profile minimal
          cd rust/football_match_engine
          cargo +1.100.0 metadata --locked --format-version 1 > "$RUNNER_TEMP/a1-locked-metadata.json"
          echo '41d521b51131a20781790cb9ee4c62c967f34003866d50d97df2a3354eae9099  Cargo.lock' | sha256sum -c -
      - name: Preserve CI artifacts on evidence branch
        working-directory: archive-branch
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = 'evidence/a1-historical'
          git add -- docs/evidence/a-1/locked-run-45593874053/
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'evidence(A-1): archive 14 verified locked baseline run artifacts'
          git push origin HEAD:refs/heads/evidence/a1-historical
      - name: Commit only the verified Cargo.lock
        run: |
          set -euo pipefail
          git add -f -- rust/football_match_engine/Cargo.lock
          if git diff --cached --quiet; then exit 0; fi
          test "$(git diff --cached --name-only)" = 'rust/football_match_engine/Cargo.lock'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build(A-1): lock exact verified dependency resolution from run 45593874053'
          git push origin HEAD:refs/heads/refactor/football-simulation-4
