name: DES V4 detailed simulation calibration
on:
  workflow_dispatch:
  push:
    branches: ['main']
    paths:
      - '.github/workflows/diagnose-v4-des.yml'
      - 'rust/football_match_engine/**'
permissions:
  contents: read
jobs:
  population:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - scenario: baseline
            matches: 1000
          - scenario: balanced
            matches: 128
          - scenario: high_press
            matches: 64
          - scenario: low_block
            matches: 64
          - scenario: strong_home
            matches: 64
          - scenario: strong_away
            matches: 64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Collect per-match simulation evidence
        env:
          DES_DIAG_SCENARIO: ${{ matrix.scenario }}
          DES_DIAG_MATCHES: ${{ matrix.matches }}
        run: |
          set -o pipefail
          mkdir -p build-evidence
          git rev-parse HEAD > build-evidence/commit.txt
          cd rust/football_match_engine
          DES_DIAG_REPORT_PATH="../../build-evidence/population.json" cargo test --release --lib v4::tests::des_calibration_population_evidence -- --ignored --exact --nocapture 2>&1 | tee ../../build-evidence/population.log
      - name: Summarize population in job log
        if: always()
        run: |
          python3 - <<'PY'
          import json, pathlib
          p = pathlib.Path("build-evidence/population.json")
          if p.exists():
              report = json.loads(p.read_text())
              print(report["scenario"])
              print(json.dumps(report["headline"], indent=2))
              from collections import defaultdict, Counter
              passes = defaultdict(Counter)
              losses = Counter()
              recovery = Counter()
              carry = Counter()
              valid = [r for r in report["matches"] if r["ok"] and r.get("diagnostics")]
              for row in valid:
                  des = row["diagnostics"]["des"]
                  for field in ("carryStarts","holdStarts","shieldStarts","lateralCarryStarts","carryContacts","carryTurnovers","carryMs","holdMs"):
                      carry[field] += des.get(field,0)
                  for side in ("home", "away"):
                      d = row["diagnostics"][side]
                      losses.update(d["turnovers"])
                      for field in ("passContactsLoose", "passLooseRegained", "passLooseLost",
                                    "passExecutionErrors", "passReceiverUnreached", "inaccurateKicksReceived",
                                    "passMissRegained", "passMissLost", "firstTouchLooseRegained",
                                    "firstTouchLooseLost", "looseRecoveryOut"):
                          recovery[field] += d.get(field, 0)
                      for kind, counts in d["passesByType"].items():
                          passes[kind].update(counts)
              n = max(1, len(valid))
              print("DES_PASS_BREAKDOWN", json.dumps({
                  "matches": len(valid),
                  "types": {k: {**{f"{m}PerMatch": v/n for m,v in c.items()},
                                 "accuracyPct": 100*c["completed"]/max(1,c["attempted"])}
                            for k,c in sorted(passes.items())},
                  "turnoversPerMatch": {k:v/n for k,v in sorted(losses.items())},
                  "loosePassRecoveryPerMatch": {k:v/n for k,v in sorted(recovery.items())}
              }, sort_keys=True))
              print("PI_CARRY_EVIDENCE", json.dumps({k:v/n for k,v in sorted(carry.items())},sort_keys=True))
              for row in report["matches"]:
                  if not row["ok"] or row.get("diagnosticError"):
                      print("FAILED SEED", row["seed"], row.get("error") or row.get("diagnosticError"))
          else:
              print("Population report unavailable; inspect compilation/test log.")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: des-population-${{ matrix.scenario }}
          path: build-evidence/
          if-no-files-found: error
  offside_regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify offside decision and movement
        working-directory: rust/football_match_engine
        run: cargo test --lib des_offside_ -- --nocapture
  pass_reach_regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify symmetric pass contact physics
        working-directory: rust/football_match_engine
        run: cargo test --lib des_pass_reach_ -- --nocapture
      - name: Verify actual match timeline
        working-directory: rust/football_match_engine
        run: cargo test --lib qa01_long_pass_interception_emitted_at_interaction_time -- --nocapture
  contact_control_regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify contact control and loose ball lifecycle
        working-directory: rust/football_match_engine
        run: cargo test --lib des_contact_control_ -- --nocapture
  loose_motion_regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify rolling ball and boundary lifecycle
        working-directory: rust/football_match_engine
        run: cargo test --lib des_loose_motion_ -- --nocapture
      - name: Verify fast and full accounting parity
        working-directory: rust/football_match_engine
        run: cargo test --lib fast_batch_and_full_event_diagnostics_match -- --nocapture
  pi_timing_regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify timed PI intentions, carry accounting and cancellation
        working-directory: rust/football_match_engine
        run: cargo test --lib pi_timing_ -- --nocapture
      - name: Verify actual full-event replay and batch parity
        working-directory: rust/football_match_engine
        run: cargo test --lib fast_batch_and_full_event_diagnostics_match -- --nocapture
  pi_on_ball_regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check shared utility, field value and actual decisions
        working-directory: rust/football_match_engine
        run: cargo test --lib pi_on_ball_ -- --nocapture
      - name: Check old interface and offside awareness
        working-directory: rust/football_match_engine
        run: |
          cargo test --lib pi4_legacy_api_and_direct_policy_match -- --nocapture
          cargo test --lib des_offside_ -- --nocapture
          cargo test --lib p2_50_match_attributes_have_explicit_runtime_wiring_and_4_are_career_hooks -- --nocapture
  pi_carry_regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check directional movement, early contact and replay
        working-directory: rust/football_match_engine
        run: |
          cargo test --lib pi_carry_ -- --nocapture
          cargo test --lib pi_timing_ -- --nocapture
          cargo test --lib fast_batch_and_full_event_diagnostics_match -- --nocapture
  attacking_sample:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Export attacking chain diagnostic fixtures
        run: |
          set -o pipefail
          mkdir -p build-evidence
          git rev-parse HEAD > build-evidence/commit.txt
          cd rust/football_match_engine
          V4_DIAGNOSTICS_REPORT_PATH=../../build-evidence/attacking_sample.json cargo test --lib v4::diagnostics::tests::export_attacking_diagnostics_sample -- --ignored --exact --nocapture 2>&1 | tee ../../build-evidence/attacking_sample.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: des-attacking-sample
          path: build-evidence/
          if-no-files-found: error
