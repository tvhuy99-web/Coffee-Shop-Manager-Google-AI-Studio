name: DES V4 detailed simulation calibration
on:
  workflow_dispatch:
  push:
    branches: ['main']
    paths:
      - '.github/workflows/diagnose-v4-des.yml'
      - 'rust/football_match_engine/**'
permissions:
  contents: read
jobs:
  population:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - scenario: baseline
            matches: 1000
          - scenario: balanced
            matches: 128
          - scenario: high_press
            matches: 64
          - scenario: low_block
            matches: 64
          - scenario: strong_home
            matches: 64
          - scenario: strong_away
            matches: 64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Collect per-match simulation evidence
        env:
          DES_DIAG_SCENARIO: ${{ matrix.scenario }}
          DES_DIAG_MATCHES: ${{ matrix.matches }}
        run: |
          set -o pipefail
          mkdir -p build-evidence
          git rev-parse HEAD > build-evidence/commit.txt
          cd rust/football_match_engine
          DES_DIAG_REPORT_PATH="../../build-evidence/population.json" cargo test --release --lib v4::tests::des_calibration_population_evidence -- --ignored --exact --nocapture 2>&1 | tee ../../build-evidence/population.log
      - name: Summarize population in job log
        if: always()
        run: |
          python3 - <<'PY'
          import json, pathlib
          p = pathlib.Path("build-evidence/population.json")
          if p.exists():
              report = json.loads(p.read_text())
              print(report["scenario"])
              print(json.dumps(report["headline"], indent=2))
              from collections import defaultdict, Counter
              passes = defaultdict(Counter)
              losses = Counter()
              recovery = Counter()
              carry = Counter()
              outlets = Counter()
              defense = Counter()
              outcomes = Counter()
              drift = Counter()
              valid = [r for r in report["matches"] if r["ok"] and r.get("diagnostics")]
              for row in valid:
                  des = row["diagnostics"]["des"]
                  for field in ("carryStarts","holdStarts","shieldStarts","lateralCarryStarts","carryContacts","carryTurnovers","carryMs","holdMs"):
                      carry[field] += des.get(field,0)
                  for field in ("outletSamples","openOutletsTotal","noOpenOutletSamples","holdDecisionSamples","holdWithOpenOutletSamples"):
                      outlets[field] += des.get(field,0)
                  for field in ("pressPlayerMs","screenPlayerMs","coverPlayerMs","pressDistanceM","screenDistanceM","coverDistanceM","markPlayerMs","markDistanceM","preparationContacts","preparationTurnovers","preparationFouls","carryFouls","tackleOpportunities","tackleCommitChoices","tackleContainChoices","tackleFrontOpportunities","tackleFrontCommits","tackleSideOpportunities","tackleSideCommits","tackleRearOpportunities","tackleRearCommits","tackleExpectedCleanSum","tackleExpectedFoulSum","tackleAuditContacts","tackleAuditClean","tackleAuditFoul","tackleAuditAdvantage","tackleAuditPiCleanSum","tackleAuditPiFoulSum","tackleAuditResolverCleanSum","tackleAuditResolverFoulSum","tackleAuditResolverAdvantageSum"):
                      defense[field] += des.get(field,0)
                  for field in ("passRiskPairs","passRiskInitialSum","passRiskReleaseSum","passRiskAbsChangeSum","passRiskIncreased","passRiskDecreased","passRiskStable","reaimReviews","reaimChoices","reaimReleases","reaimPlannedMs","reaimRiskPairs","reaimRiskReductionSum"):
                      drift[field] += des.get(field,0)
                  outcomes["penaltyPhases"] += des["deadBallDistributions"]["penalty"]["count"]
                  for side in ("home", "away"):
                      summary = row["summary"][side]
                      for field in ("goals","ownGoalsFor","fouls","yellowCards","redCards","xg","shotsOnTarget"):
                          outcomes[field] += summary.get(field,0)
                      d = row["diagnostics"][side]
                      losses.update(d["turnovers"])
                      for field in ("passContactsLoose", "passLooseRegained", "passLooseLost",
                                    "passExecutionErrors", "passReceiverUnreached", "inaccurateKicksReceived",
                                    "passMissRegained", "passMissLost", "firstTouchLooseRegained",
                                    "firstTouchLooseLost", "looseRecoveryOut"):
                          recovery[field] += d.get(field, 0)
                      for kind, counts in d["passesByType"].items():
                          passes[kind].update(counts)
              n = max(1, len(valid))
              print("DES_PASS_BREAKDOWN", json.dumps({
                  "matches": len(valid),
                  "types": {k: {**{f"{m}PerMatch": v/n for m,v in c.items()},
                                 "accuracyPct": 100*c["completed"]/max(1,c["attempted"])}
                            for k,c in sorted(passes.items())},
                  "turnoversPerMatch": {k:v/n for k,v in sorted(losses.items())},
                  "loosePassRecoveryPerMatch": {k:v/n for k,v in sorted(recovery.items())}
              }, sort_keys=True))
              print("PI_CARRY_EVIDENCE", json.dumps({k:v/n for k,v in sorted(carry.items())},sort_keys=True))
              print("PI_SUPPORT_EVIDENCE", json.dumps({
                  "samplesPerMatch": outlets["outletSamples"]/n,
                  "openOutletsPerObservation": outlets["openOutletsTotal"]/max(1,outlets["outletSamples"]),
                  "noOpenOutletPct": 100*outlets["noOpenOutletSamples"]/max(1,outlets["outletSamples"]),
                  "holdDecisionSamplesPerMatch": outlets["holdDecisionSamples"]/n,
                  "holdWithOpenOutletPct": 100*outlets["holdWithOpenOutletSamples"]/max(1,outlets["holdDecisionSamples"])
              },sort_keys=True))
              print("PI_DEFENSE_EVIDENCE",json.dumps({k:v/n for k,v in sorted(defense.items())},sort_keys=True))
              assert defense["tackleOpportunities"] == sum(defense["tackle"+g+"Opportunities"] for g in ("Front","Side","Rear"))
              assert defense["tackleCommitChoices"] == sum(defense["tackle"+g+"Commits"] for g in ("Front","Side","Rear"))
              assert defense["tackleOpportunities"] == defense["tackleCommitChoices"] + defense["tackleContainChoices"]
              print("PI_TACKLE_GEOMETRY",json.dumps({
                  "commitPctByApproach":{g:100*defense["tackle"+g+"Commits"]/max(1,defense["tackle"+g+"Opportunities"]) for g in ("Front","Side","Rear")},
                  "perCommittedCandidateCleanPrior":defense["tackleExpectedCleanSum"]/max(1,defense["tackleCommitChoices"]),
                  "perCommittedCandidateFoulPrior":defense["tackleExpectedFoulSum"]/max(1,defense["tackleCommitChoices"])
              },sort_keys=True))
              contacts=defense["tackleAuditContacts"]
              assert contacts == defense["preparationContacts"]+carry["carryContacts"]
              assert defense["tackleAuditClean"]+defense["tackleAuditFoul"]+defense["tackleAuditAdvantage"] <= contacts
              assert defense["tackleAuditFoul"] == defense["preparationFouls"]+defense["carryFouls"]
              print("PI_TACKLE_CONTACT_AUDIT",json.dumps({
                  "contactsPerMatch":contacts/n,
                  "meanPiClean":defense["tackleAuditPiCleanSum"]/max(1,contacts),
                  "meanPiFoulIncludingAdvantage":defense["tackleAuditPiFoulSum"]/max(1,contacts),
                  "meanResolverClean":defense["tackleAuditResolverCleanSum"]/max(1,contacts),
                  "meanResolverStoppedFoul":defense["tackleAuditResolverFoulSum"]/max(1,contacts),
                  "meanResolverAdvantage":defense["tackleAuditResolverAdvantageSum"]/max(1,contacts),
                  "observedClean":defense["tackleAuditClean"]/max(1,contacts),
                  "observedStoppedFoul":defense["tackleAuditFoul"]/max(1,contacts),
                  "observedAdvantage":defense["tackleAuditAdvantage"]/max(1,contacts)
              },sort_keys=True))
              print("PI_CONTEST_OUTCOMES",json.dumps({k:v/n for k,v in sorted(outcomes.items())},sort_keys=True))
              assert drift["passRiskPairs"] == drift["passRiskIncreased"]+drift["passRiskDecreased"]+drift["passRiskStable"]
              print("PI_PASS_RISK_DRIFT",json.dumps({
                  "pairsPerMatch":drift["passRiskPairs"]/n,
                  "initialMean":drift["passRiskInitialSum"]/max(1,drift["passRiskPairs"]),
                  "releaseMean":drift["passRiskReleaseSum"]/max(1,drift["passRiskPairs"]),
                  "meanAbsoluteChange":drift["passRiskAbsChangeSum"]/max(1,drift["passRiskPairs"]),
                  "increasedPct":100*drift["passRiskIncreased"]/max(1,drift["passRiskPairs"]),
                  "decreasedPct":100*drift["passRiskDecreased"]/max(1,drift["passRiskPairs"]),
                  "stablePct":100*drift["passRiskStable"]/max(1,drift["passRiskPairs"])
              },sort_keys=True))
              assert drift["reaimReleases"] <= drift["reaimChoices"] <= drift["reaimReviews"]
              print("PI_PASS_REAIM",json.dumps({
                  "reviewsPerMatch":drift["reaimReviews"]/n,
                  "choicesPerMatch":drift["reaimChoices"]/n,
                  "releasesPerMatch":drift["reaimReleases"]/n,
                  "choicePct":100*drift["reaimChoices"]/max(1,drift["reaimReviews"]),
                  "plannedExtraMsPerChoice":drift["reaimPlannedMs"]/max(1,drift["reaimChoices"]),
                  "meanRiskReductionAtRevision":drift["reaimRiskReductionSum"]/max(1,drift["reaimRiskPairs"])
              },sort_keys=True))
              for row in report["matches"]:
                  if not row["ok"] or row.get("diagnosticError"):
                      print("FAILED SEED", row["seed"], row.get("error") or row.get("diagnosticError"))
          else:
              print("Population report unavailable; inspect compilation/test log.")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: des-population-${{ matrix.scenario }}
          path: build-evidence/
          if-no-files-found: error
  offside_regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify offside decision and movement
        working-directory: rust/football_match_engine
        run: cargo test --lib des_offside_ -- --nocapture
  pass_reach_regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify symmetric pass contact physics
        working-directory: rust/football_match_engine
        run: cargo test --lib des_pass_reach_ -- --nocapture
      - name: Verify actual match timeline
        working-directory: rust/football_match_engine
        run: cargo test --lib qa01_long_pass_interception_emitted_at_interaction_time -- --nocapture
  contact_control_regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify contact control and loose ball lifecycle
        working-directory: rust/football_match_engine
        run: cargo test --lib des_contact_control_ -- --nocapture
  loose_motion_regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify rolling ball and boundary lifecycle
        working-directory: rust/football_match_engine
        run: cargo test --lib des_loose_motion_ -- --nocapture
      - name: Verify fast and full accounting parity
        working-directory: rust/football_match_engine
        run: cargo test --lib fast_batch_and_full_event_diagnostics_match -- --nocapture
  pi_timing_regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify timed PI intentions, carry accounting and cancellation
        working-directory: rust/football_match_engine
        run: |
          cargo test --lib pi_timing_ -- --nocapture
          cargo test --lib pi_checkpoint_ -- --nocapture
          cargo test --lib pi_clock_ -- --nocapture
          cargo test --lib qa10_mid_interval_tactical_event_preserves_total_movement_and_fatigue -- --nocapture
          cargo test --lib des_checkpoint_roundtrip_exact_continuation_all_states -- --nocapture
      - name: Verify actual full-event replay and batch parity
        working-directory: rust/football_match_engine
        run: cargo test --lib fast_batch_and_full_event_diagnostics_match -- --nocapture
  pi_on_ball_regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check shared utility, field value and actual decisions
        working-directory: rust/football_match_engine
        run: |
          cargo test --lib pi_on_ball_ -- --nocapture
          cargo test --lib pi_pass_forecast_ -- --nocapture
          cargo test --lib pi_pass_reaim_ -- --nocapture
          cargo test --lib pi_psychology_ -- --nocapture
      - name: Check old interface and offside awareness
        working-directory: rust/football_match_engine
        run: |
          cargo test --lib pi4_legacy_api_and_direct_policy_match -- --nocapture
          cargo test --lib des_offside_ -- --nocapture
          cargo test --lib p2_50_match_attributes_have_explicit_runtime_wiring_and_4_are_career_hooks -- --nocapture
  pi_carry_regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check directional movement, early contact and replay
        working-directory: rust/football_match_engine
        run: |
          cargo test --lib pi_carry_ -- --nocapture
          cargo test --lib pi_timing_ -- --nocapture
          cargo test --lib fast_batch_and_full_event_diagnostics_match -- --nocapture
  pi_support_regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify support lanes, symmetry, shape and legality
        working-directory: rust/football_match_engine
        run: |
          cargo test --lib pi_support_ -- --nocapture
          cargo test --lib des_offside_ -- --nocapture
          cargo test --lib fast_batch_and_full_event_diagnostics_match -- --nocapture
  pi_defense_regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify distinct defensive roles, engagement range and movement budget
        working-directory: rust/football_match_engine
        run: |
          cargo test --lib pi_defense_ -- --nocapture
          cargo test --lib pi_support_ -- --nocapture
          cargo test --lib fast_batch_and_full_event_diagnostics_match -- --nocapture
  attacking_sample:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Export attacking chain diagnostic fixtures
        run: |
          set -o pipefail
          mkdir -p build-evidence
          git rev-parse HEAD > build-evidence/commit.txt
          cd rust/football_match_engine
          V4_DIAGNOSTICS_REPORT_PATH=../../build-evidence/attacking_sample.json cargo test --lib v4::diagnostics::tests::export_attacking_diagnostics_sample -- --ignored --exact --nocapture 2>&1 | tee ../../build-evidence/attacking_sample.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: des-attacking-sample
          path: build-evidence/
          if-no-files-found: error
