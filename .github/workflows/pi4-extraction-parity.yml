name: PI 4.0 extraction exact parity
# This fixed-baseline experiment is not an eternal gate for intentional
# future PI behavior changes. Only this workflow's introduction/edit or a
# manual dispatch triggers it; the regular DES diagnostics still run normally.
on:
  workflow_dispatch:
  push:
    branches: ['main']
    paths:
      - '.github/workflows/pi4-extraction-parity.yml'
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - scenario: baseline
            matches: 1000
          - scenario: balanced
            matches: 128
          - scenario: high_press
            matches: 64
          - scenario: low_block
            matches: 64
          - scenario: strong_home
            matches: 64
          - scenario: strong_away
            matches: 64
          - scenario: full_event
            matches: 12
    steps:
      - uses: actions/checkout@v4
        with:
          path: candidate
      - uses: actions/checkout@v4
        with:
          ref: '964e56a355637ef9753cdf89cc58a696ad064ca0'
          path: baseline
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify exact baseline and toolchain
        run: |
          test "$(git -C baseline rev-parse HEAD)" = '964e56a355637ef9753cdf89cc58a696ad064ca0'
          mkdir -p evidence
          git -C baseline rev-parse HEAD > evidence/baseline-commit.txt
          git -C candidate rev-parse HEAD > evidence/candidate-commit.txt
          rustc -Vv > evidence/rustc.txt
      - name: Run both independently compiled policies
        env:
          DES_DIAG_SCENARIO: ${{ matrix.scenario }}
          DES_DIAG_MATCHES: ${{ matrix.matches }}
        run: |
          set -euo pipefail
          root="$PWD"
          if [ "$DES_DIAG_SCENARIO" = full_event ]; then
            cp candidate/rust/football_match_engine/src/v4/pi_parity_fixture.rs baseline/rust/football_match_engine/src/v4/
            printf '\ninclude!("pi_parity_fixture.rs");\n' >> baseline/rust/football_match_engine/src/v4/tests.rs
          fi
          for variant in baseline candidate; do
            (
              cd "$root/$variant/rust/football_match_engine"
              export CARGO_TARGET_DIR="$root/target-$variant"
              if [ "$DES_DIAG_SCENARIO" = full_event ]; then
                PI_FULL_REPORT_PATH="$root/evidence/$variant.json" cargo test --release --lib v4::tests::pi_extraction_full_event_evidence -- --ignored --exact --nocapture
              else
                DES_DIAG_REPORT_PATH="$root/evidence/$variant.json" cargo test --release --lib v4::tests::des_calibration_population_evidence -- --ignored --exact --nocapture
              fi
            ) 2>&1 | tee "$root/evidence/$variant.log"
          done
      - name: Compare every seed, fingerprint, summary, diagnostics and full events
        env:
          SCENARIO: ${{ matrix.scenario }}
          COUNT: ${{ matrix.matches }}
        run: |
          set -o pipefail
          extra=()
          if [ "$SCENARIO" = full_event ]; then extra+=(--full); fi
          python3 candidate/scripts/compare_pi_extraction.py evidence/baseline.json evidence/candidate.json --expected "$COUNT" "${extra[@]}" | tee evidence/parity.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pi4-parity-${{ matrix.scenario }}
          path: evidence/
          if-no-files-found: error
  interface:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check public compatibility and independent policy tests
        working-directory: rust/football_match_engine
        run: |
          cargo test --lib pi4_legacy_api_and_direct_policy_match -- --nocapture
          cargo test --lib des_offside_ -- --nocapture
          cargo test --lib fast_batch_and_full_event_diagnostics_match -- --nocapture
