name: Rust V4 Attribute Impact Regression
on:
  push:
    paths:
      - 'rust/football_match_engine/**'
      - 'tools/verify_v4_impact_report.py'
      - '.github/workflows/validate-v4-attribute-impact.yml'
  pull_request:
    paths:
      - 'rust/football_match_engine/**'
      - 'tools/verify_v4_impact_report.py'
      - '.github/workflows/validate-v4-attribute-impact.yml'
jobs:
  test-v4-impact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run isolated V4 attribute impact regression
        working-directory: rust/football_match_engine
        run: cargo test --lib v4::attribute_impact_tests:: -- --nocapture
      - name: Run 50 paired-seed probes and 90-minute report
        working-directory: rust/football_match_engine
        run: |
          V4_IMPACT_SEEDS=12 V4_IMPACT_REPORT_PATH=../../build-evidence/v4_attribute_impact.json cargo test --lib v4::attribute_impact_tests::exhaustive_50_attribute_counterfactual_report -- --ignored --nocapture
          V4_REALISM_MATCHES=128 V4_REALISM_REPORT_PATH=../../build-evidence/v4_realism_baseline.json cargo test --lib v4::attribute_impact_tests::monte_carlo_realism_baseline_report -- --ignored --nocapture
      - name: Validate machine-readable attribute evidence
        run: python3 tools/verify_v4_impact_report.py build-evidence/v4_attribute_impact.json build-evidence/v4_realism_baseline.json
      - name: Upload machine-readable evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v4-impact-report
          path: build-evidence/
          if-no-files-found: warn
          retention-days: 30
