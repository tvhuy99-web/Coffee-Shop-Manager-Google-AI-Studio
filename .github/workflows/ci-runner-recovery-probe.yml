name: CI runner and PI recovery probe

# A one-time push trigger for the diagnostic itself; subsequent retries
# are manual. This does not disable or replace any existing regression.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ci-runner-recovery-probe.yml'

permissions:
  contents: read

jobs:
  runner_probe:
    name: Runner only (no checkout or dependencies)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Confirm shell execution
        shell: bash
        run: |
          set -eu
          printf '%s\n' 'CI_RUNNER_PROBE_OK'
          uname -srm
          printf 'commit=%s\n' "$GITHUB_SHA"
          printf '%s\n' 'No repository checkout or dependency setup performed.'

  pi_recovery:
    name: PI 4.0.19 focused recovery checks
    needs: runner_probe
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Confirm second runner
        run: echo CI_RECOVERY_RUNNER_OK
      - name: Check out exact triggering commit
        uses: actions/checkout@v4
      - name: Verify source and current P0 structural contracts
        run: |
          git rev-parse HEAD
          python3 tools/verify_v4_p0_p1_patch.py
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Compile and run targeted psychology and lifecycle tests
        working-directory: rust/football_match_engine
        run: |
          set -euo pipefail
          rustc --version
          cargo --version
          cargo test --lib pi_psychology_ -- --nocapture
          cargo test --lib pi_checkpoint_ -- --nocapture
          cargo test --lib p1_batch_substitution_counts_one_window_and_returns_authoritative_roster -- --nocapture
          cargo test --lib stage_d_ai_manager_executes_substitutions_deterministically -- --nocapture
          cargo test --lib des_checkpoint_roundtrip_exact_continuation_all_states -- --nocapture
