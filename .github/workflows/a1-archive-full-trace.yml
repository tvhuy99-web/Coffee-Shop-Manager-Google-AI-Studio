name: A-1 preserve complete per-seed event traces
on:
  push:
    branches: ['refactor/football-simulation-4']
    paths: ['.github/workflows/a1-archive-full-trace.yml']
  workflow_dispatch:
permissions: {}
concurrency:
  group: pingfootball-a1-evidence-archive
  cancel-in-progress: false
jobs:
  archive:
    if: github.repository == 'tvhuy99-web/Coffee-Shop-Manager-Google-AI-Studio' && github.ref == 'refs/heads/refactor/football-simulation-4'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: evidence/a1-historical
      - name: Verify original ZIPs, lossless trace shards and partition large ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import gzip, hashlib, json, re, subprocess, tempfile, zipfile
          from pathlib import Path
          repo='tvhuy99-web/Coffee-Shop-Manager-Google-AI-Studio'
          run_id=45611578006
          head='365261da01501701bcca5a3b63668d6e062096fb'
          baseline='c2c392d8b3ccc57985e87337e8994fd7033328ee'
          lock='41d521b51131a20781790cb9ee4c62c967f34003866d50d97df2a3354eae9099'
          entries=json.loads(r'''[{"id":15020996426,"name":"a1-full-trace-low_block","sha256":"d81cd482c1268bfe4955620194c128eba317e11cc5161cbeae7c715ea8e3b443","size":11061625},{"id":15020726017,"name":"a1-full-trace-balanced","sha256":"4ea67c2e47c547fddec89948cd1925e6f5bb4845887743a2894a9bc94d5cc6f8","size":22780172},{"id":15020213348,"name":"a1-full-trace-strong_away","sha256":"5cabed1ed2edeb9f4555fa4cfbfe40efb688340db536a68ba4787b602cae7bca","size":10364030},{"id":15020099431,"name":"a1-full-trace-baseline","sha256":"96b754f7dd8a450ef9a10baa35ce64a0fea15e9c897cd3061d19ef0500e8c2fc","size":177539513},{"id":15020058556,"name":"a1-full-trace-strong_home","sha256":"2f6a855a39be275be246df34c41bf76c9ce2e0c405ab51582d9ff9ebf22198b5","size":10241335},{"id":15019918497,"name":"a1-full-trace-high_press","sha256":"63145ec8ac20c586159a0964cc4e03283246122b8a55192008b4106f0f26a2fe","size":11480813}]''')
          meta=json.loads(subprocess.check_output(['gh','api',f'/repos/{repo}/actions/runs/{run_id}']))
          assert meta['conclusion']=='success' and meta['head_sha']==head and meta['path']=='.github/workflows/a1-full-trace.yml'
          counts={'baseline':1000,'balanced':128,'high_press':64,'low_block':64,'strong_home':64,'strong_away':64}
          dest=Path(f'docs/evidence/a-1/verified-run-{run_id}')
          dest.mkdir(parents=True,exist_ok=True)
          def digest(f):
              h=hashlib.sha256()
              for data in iter(lambda:f.read(1024*1024),b''): h.update(data)
              return h.hexdigest()
          reports=[]
          with tempfile.TemporaryDirectory() as tmp:
              for item in entries:
                  name=item['name']
                  assert re.fullmatch('[a-z0-9_-]+',name)
                  zip_path=Path(tmp)/(name+'.zip')
                  with zip_path.open('wb') as f:
                      subprocess.run(['gh','api',f"/repos/{repo}/actions/artifacts/{item['id']}/zip"],stdout=f,check=True)
                  assert zip_path.stat().st_size==item['size']
                  with zip_path.open('rb') as f: assert digest(f)==item['sha256']
                  with zipfile.ZipFile(zip_path) as z:
                      assert z.testzip() is None
                      assert z.read('commit.txt').decode().strip()==baseline
                      assert z.read('harness-commit.txt').decode().strip()==head
                      assert hashlib.sha256(z.read('Cargo.lock')).hexdigest()==lock
                      members={}
                      for n in z.namelist():
                          if not n.endswith('/'):
                              with z.open(n) as f: members[n]=digest(f)
                      for line in z.read('SHA256SUMS').decode().splitlines():
                          sha,n=line.split('  ',1)
                          assert members[n]==sha
                      report=json.loads(z.read('trace-report.json'))
                      cohort=name.removeprefix('a1-full-trace-')
                      assert report['scenario']==cohort and report['rows']==counts[cohort] and report['mismatches']==0
                      raw=hashlib.sha256(); rows=events=0
                      for n in report['shards']:
                          with z.open(n) as compressed, gzip.GzipFile(fileobj=compressed) as f:
                              for line in f:
                                  raw.update(line)
                                  row=json.loads(line)
                                  assert row['seed']==104729+rows*7907 and row['scenario']==cohort
                                  assert len(row['events'])==row['eventCount']>0
                                  rows+=1; events+=row['eventCount']
                      assert rows==report['rows'] and events==report['events']
                      assert raw.hexdigest()==report['firstSha256']==report['secondSha256']==report['recoveredSha256']
                  # GitHub rejects individual blobs above 100 MiB. Preserve original ZIP bytes
                  # in ordered <=64 MiB parts, without recompression or re-encoding.
                  parts=[]; recombined=hashlib.sha256()
                  with zip_path.open('rb') as f:
                      i=0
                      while data:=f.read(64*1024*1024):
                          filename=f'{name}.zip.part{i:03d}' if item['size']>64*1024*1024 else name+'.zip'
                          path=dest/filename
                          sha=hashlib.sha256(data).hexdigest()
                          if path.exists():
                              with path.open('rb') as current: assert digest(current)==sha
                          else: path.write_bytes(data)
                          parts.append({'path':filename,'sha256':sha,'size':len(data)})
                          with path.open('rb') as part:
                              for chunk in iter(lambda:part.read(1024*1024),b''): recombined.update(chunk)
                          i+=1
                  assert recombined.hexdigest()==item['sha256']
                  reports.append({**item,'parts':parts,'member_sha256':members,'trace_report':report})
                  print(f"Verified {cohort}: {rows} seeds, {events} events, {len(parts)} ZIP parts")
          assert sum(x['trace_report']['rows'] for x in reports)==1384
          assert sum(x['trace_report']['events'] for x in reports)==4320279
          (dest/'verified-manifest.json').write_text(json.dumps({'schema':1,'run_id':run_id,'baseline_sha':baseline,'lock_sha256':lock,'harness_sha':head,'total_seeds':1384,'total_events':4320279,'artifacts':reports},indent=2,sort_keys=True)+'\n')
          PY
      - name: Commit verified evidence only
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = evidence/a1-historical
          git add -- docs/evidence/a-1/verified-run-45611578006/
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'evidence(A-1): preserve 6 complete event trace archives with lossless ZIP parts'
          git push origin HEAD:refs/heads/evidence/a1-historical
