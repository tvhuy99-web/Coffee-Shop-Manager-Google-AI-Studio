[package]
name = "football_match_engine"
version = "0.4.0"
edition = "2021"
license = "LicenseRef-PingFootball-User-Source"
description = "Football Match Lab native engine: V4.1 DES 54-attribute 90-minute interactive & FastBatch simulation engine."

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
player_intelligence = { path = "../crates/player_intelligence" }
coach_intelligence = { path = "../crates/coach_intelligence" }
match_contracts = { path = "../crates/match_contracts" }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
jni = "0.21"
thiserror = "1.0"
rayon = "1.10"
