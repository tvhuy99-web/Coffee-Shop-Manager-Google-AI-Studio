[workspace]
resolver = "2"
members = ["football_match_engine", "crates/match_contracts", "crates/player_intelligence", "crates/coach_intelligence", "crates/match_physics", "crates/player_condition", "crates/match_tactics", "crates/match_rules"]
default-members = ["football_match_engine"]

[profile.release]
lto = true
codegen-units = 1
# Use unwind (not abort) so JNI catch_unwind boundaries can safely trap panics and return JSON errors to Android JVM.
panic = "unwind"

