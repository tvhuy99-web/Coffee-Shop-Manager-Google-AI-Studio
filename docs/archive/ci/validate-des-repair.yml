name: DES v1.4 repaired build and evidence
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'rust/football_match_engine/**'
      - 'app/src/main/**'
      - 'tests/des_playback_jvm/**'
      - 'tools/run_des_playback_jvm.sh'
      - '.github/workflows/validate-des-repair.yml'
  push:
    branches: ['main', 'feat/des-v1.4-repair*']
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Kotlin CLI
        run: |
          curl -fsSL https://github.com/JetBrains/kotlin/releases/download/v1.9.25/kotlin-compiler-1.9.25.zip -o /tmp/kotlin.zip
          unzip -q /tmp/kotlin.zip -d /tmp/kotlin
          echo '/tmp/kotlin/kotlinc/bin' >> "$GITHUB_PATH"
      - name: Static contracts and production Kotlin tests
        run: |
          python3 tools/verify_v4_des_contract.py
          bash tools/run_des_playback_jvm.sh
          bash tools/run_commentary_regression.sh
      - name: Rust compilation and regression tests
        working-directory: rust/football_match_engine
        run: |
          cargo check --all-targets
          cargo test --all-targets
      - name: Monte Carlo actual results
        run: |
          mkdir -p build-evidence
          cd rust/football_match_engine
          V4_REALISM_MATCHES=128 V4_REALISM_REPORT_PATH=../../build-evidence/realism_128.json cargo test --lib v4::attribute_impact_tests::monte_carlo_realism_baseline_report -- --ignored --nocapture
          V4_REALISM_MATCHES=1000 V4_REALISM_REPORT_PATH=../../build-evidence/realism_1000.json cargo test --lib v4::attribute_impact_tests::monte_carlo_realism_baseline_report -- --ignored --nocapture
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: des-runtime-evidence
          path: build-evidence/
          if-no-files-found: warn
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: SDK and NDK
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.1' 'ndk;27.2.12479018'
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=${ANDROID_HOME}/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - run: cargo install cargo-ndk --locked
      - name: Build ARM64 native engine
        env:
          RUST_ANDROID_ABIS: arm64-v8a
        run: bash tools/build_lab_rust_android.sh
      - name: Build Android APK
        run: bash gradlew :app:validateCommentaryTokens :app:assembleDebug --no-daemon --console plain
      - uses: actions/upload-artifact@v4
        with:
          name: des-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
