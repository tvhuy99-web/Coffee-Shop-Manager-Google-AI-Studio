name: Validate clean Kotlin and Rust Match Lab

on:
  workflow_dispatch:
  push:
    paths:
      - 'rust/**'
      - 'tests/parity/**'
      - 'tools/**'
      - 'app/**'
      - '*.gradle'
      - '.github/workflows/validate-port.yml'
  pull_request:

jobs:
  rust-parity:
    name: Rust engine and saved Java V3 golden parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Static integrity, saved Java fixtures, Rust unit and parity tests
        run: REQUIRE_RUST=1 bash tools/run_v2_parity.sh

  android-validator:
    name: Validate Kotlin commentary resources with Gradle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install compile SDK and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.1"
      - name: Verify commentary resource tokens (Kotlin formatter)
        run: bash gradlew :app:validateCommentaryTokens --no-daemon

  commentary-regression:
    name: Commentary evidence regressions (no Android SDK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Test 329 commentary cases against original Vietnamese and English XML
        run: bash gradlew -p tests/commentary run --no-daemon
