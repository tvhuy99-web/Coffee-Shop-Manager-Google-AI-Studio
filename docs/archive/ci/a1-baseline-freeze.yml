name: A-1 baseline freeze evidence
on:
  push:
    branches: ['refactor/football-simulation-4']
    paths:
      - '.github/workflows/a1-baseline-freeze.yml'
      - 'rust/rust-toolchain.toml'
      - 'rust/football_match_engine/Cargo.lock'
  workflow_dispatch:
permissions:
  contents: read
env:
  BASELINE_SHA: c2c392d8b3ccc57985e87337e8994fd7033328ee
  RUST_VERSION: '1.100.0'
jobs:
  freeze_inputs:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c2c392d8b3ccc57985e87337e8994fd7033328ee
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
      - name: Resolve and record exact inputs
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BASELINE_SHA"
          mkdir -p evidence
          git rev-parse HEAD > evidence/commit.txt
          git ls-tree -r HEAD > evidence/git-tree.txt
          git ls-files -z | xargs -0 sha256sum > evidence/source.sha256
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustc +"$RUST_VERSION" -Vv > evidence/rustc.txt
          cargo +"$RUST_VERSION" -V > evidence/cargo.txt
          uname -a > evidence/runner.txt
          cd rust/football_match_engine
          # A-1 has promoted the original lock; never silently resolve dependencies again.
          git -C ../../control ls-files --error-unmatch rust/football_match_engine/Cargo.lock
          cp ../../control/rust/football_match_engine/Cargo.lock Cargo.lock
          echo '41d521b51131a20781790cb9ee4c62c967f34003866d50d97df2a3354eae9099  Cargo.lock' | sha256sum -c -
          printf 'committed lockfile at %s\n' "$GITHUB_SHA" > ../../evidence/lockfile-origin.txt
          cargo +"$RUST_VERSION" metadata --locked --format-version 1 > ../../evidence/cargo-metadata.json
          cp Cargo.lock ../../evidence/Cargo.lock
          cd ../..
          python3 tools/verify_lab_v2.py | tee evidence/static-integrity.log
          grep -Fq 'PASS exactly 48 checksum entries (48)' evidence/static-integrity.log
          grep -Fq 'PASS values has 895 commentary templates (895)' evidence/static-integrity.log
          grep -Fq 'PASS values-vi has 895 commentary templates (895)' evidence/static-integrity.log
          (cd evidence && sha256sum Cargo.lock cargo-metadata.json commit.txt git-tree.txt source.sha256 rustc.txt cargo.txt runner.txt lockfile-origin.txt static-integrity.log > SHA256SUMS)
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        with:
          name: a1-locked-inputs
          path: evidence/
          if-no-files-found: error
          retention-days: 90
  parity:
    needs: freeze_inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - { scenario: baseline, matches: 1000 }
          - { scenario: balanced, matches: 128 }
          - { scenario: high_press, matches: 64 }
          - { scenario: low_block, matches: 64 }
          - { scenario: strong_home, matches: 64 }
          - { scenario: strong_away, matches: 64 }
          - { scenario: full_event, matches: 12 }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c2c392d8b3ccc57985e87337e8994fd7033328ee
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: a1-locked-inputs
          path: locked-inputs
      - name: Replay baseline twice using the same dependency resolution
        env:
          DES_DIAG_SCENARIO: ${{ matrix.scenario }}
          DES_DIAG_MATCHES: ${{ matrix.matches }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BASELINE_SHA"
          (cd locked-inputs && sha256sum -c SHA256SUMS)
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustc +"$RUST_VERSION" -Vv | diff - locked-inputs/rustc.txt
          cp locked-inputs/Cargo.lock rust/football_match_engine/Cargo.lock
          root="$PWD"
          mkdir -p evidence
          cp locked-inputs/{commit.txt,Cargo.lock,rustc.txt} evidence/
          for run in first second; do
            (
              cd rust/football_match_engine
              export CARGO_TARGET_DIR="$root/target-$run"
              if [ "$DES_DIAG_SCENARIO" = full_event ]; then
                PI_FULL_REPORT_PATH="$root/evidence/$run.json" cargo +"$RUST_VERSION" test --locked --release --lib v4::tests::pi_extraction_full_event_evidence -- --ignored --exact --nocapture
              else
                DES_DIAG_REPORT_PATH="$root/evidence/$run.json" cargo +"$RUST_VERSION" test --locked --release --lib v4::tests::des_calibration_population_evidence -- --ignored --exact --nocapture
              fi
            ) 2>&1 | tee "evidence/$run.log"
          done
          extra=()
          if [ "$DES_DIAG_SCENARIO" = full_event ]; then extra+=(--full); fi
          python3 scripts/compare_pi_extraction.py evidence/first.json evidence/second.json --expected "$DES_DIAG_MATCHES" "${extra[@]}" | tee evidence/parity.log
          if [ "$DES_DIAG_SCENARIO" = baseline ]; then
            mutant="$(mktemp)"
            trap 'rm -f "$mutant"' EXIT
            python3 - "$mutant" <<'PY'
          import json, sys
          from pathlib import Path
          report = json.loads(Path('evidence/second.json').read_text())
          report['matches'][0]['summary']['home']['goals'] += 1
          Path(sys.argv[1]).write_text(json.dumps(report))
          PY
            if python3 scripts/compare_pi_extraction.py evidence/first.json "$mutant" --expected "$DES_DIAG_MATCHES" > evidence/negative-control.log 2>&1; then
              echo 'ERROR: comparator accepted a deliberately changed result' >&2
              exit 1
            fi
            grep -Fq 'Behavior changed during PI extraction' evidence/negative-control.log
            echo 'Negative control rejected changed result as intended'
          fi
          (cd evidence && sha256sum *.json *.log Cargo.lock commit.txt rustc.txt > SHA256SUMS)
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a1-parity-${{ matrix.scenario }}
          path: evidence/
          if-no-files-found: error
          retention-days: 90
  audit_54:
    needs: freeze_inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        group: [technical, mental, physical, goalkeeping, hidden]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c2c392d8b3ccc57985e87337e8994fd7033328ee
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: a1-locked-inputs
          path: locked-inputs
      - name: Run paired attribute audit on PI 4.0.28
        env:
          PI_AUDIT_GROUP: ${{ matrix.group }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BASELINE_SHA"
          (cd locked-inputs && sha256sum -c SHA256SUMS)
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustc +"$RUST_VERSION" -Vv | diff - locked-inputs/rustc.txt
          cp locked-inputs/Cargo.lock rust/football_match_engine/Cargo.lock
          mkdir -p evidence
          cp locked-inputs/{commit.txt,Cargo.lock,rustc.txt} evidence/
          (
            cd rust/football_match_engine
            cargo +"$RUST_VERSION" test --locked --lib v4::tests::pi_attribute_audit_changes_only_the_named_field_and_role -- --exact --nocapture
            PI_AUDIT_REPORT_PATH="$GITHUB_WORKSPACE/evidence/attribute-audit.json" cargo +"$RUST_VERSION" test --locked --release --lib v4::tests::pi_attribute_audit_population -- --ignored --exact --nocapture
          ) 2>&1 | tee evidence/attribute-audit.log
          grep -Fq 'test v4::tests::pi_attribute_audit_changes_only_the_named_field_and_role ... ok' evidence/attribute-audit.log
          python3 tools/summarize_pi_attribute_audit.py evidence/attribute-audit.json evidence/attribute-summary.json
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          report = json.loads(Path('evidence/attribute-audit.json').read_text())
          counts = {'technical': 13, 'mental': 14, 'physical': 8, 'goalkeeping': 9, 'hidden': 10}
          group = os.environ['PI_AUDIT_GROUP']
          assert report['group'] == group
          assert report['piVersion'] == '4.0.28'
          assert report['simulations'] == 8 + 16 * counts[group]
          assert len(report['pairs']) == 8 * counts[group]
          PY
          (cd evidence && sha256sum *.json *.log Cargo.lock commit.txt rustc.txt > SHA256SUMS)
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a1-audit-${{ matrix.group }}
          path: evidence/
          if-no-files-found: error
          retention-days: 90
  continuation:
    needs: freeze_inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c2c392d8b3ccc57985e87337e8994fd7033328ee
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: a1-locked-inputs
          path: locked-inputs
      - name: Existing checkpoint continuation regression
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BASELINE_SHA"
          (cd locked-inputs && sha256sum -c SHA256SUMS)
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustc +"$RUST_VERSION" -Vv | diff - locked-inputs/rustc.txt
          cp locked-inputs/Cargo.lock rust/football_match_engine/Cargo.lock
          mkdir -p evidence
          cp locked-inputs/{commit.txt,Cargo.lock,rustc.txt} evidence/
          (
            cd rust/football_match_engine
            cargo +"$RUST_VERSION" test --locked --lib v4::tests::des_checkpoint_roundtrip_exact_continuation_all_states -- --exact --nocapture
            cargo +"$RUST_VERSION" test --locked --lib pi_checkpoint_ -- --nocapture
          ) 2>&1 | tee evidence/checkpoint.log
          grep -Fq 'test v4::tests::des_checkpoint_roundtrip_exact_continuation_all_states ... ok' evidence/checkpoint.log
          grep -Eq 'test .*pi_checkpoint_.* \.\.\. ok' evidence/checkpoint.log
          (cd evidence && sha256sum checkpoint.log Cargo.lock commit.txt rustc.txt > SHA256SUMS)
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a1-continuation
          path: evidence/
          if-no-files-found: error
          retention-days: 90
