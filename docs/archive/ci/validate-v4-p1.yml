name: Validate Rust V4 P1 interactive semantics
on:
  push:
    paths:
      - 'rust/football_match_engine/**'
      - 'app/src/main/java/pl/mkrstudio/truefootball3/lab/**'
      - 'tests/p1_kotlin/**'
      - 'tools/verify_v4_p1_234.py'
      - 'tools/run_v4_p1_jvm_smoke.sh'
  pull_request:
    paths:
      - 'rust/football_match_engine/**'
      - 'app/src/main/java/pl/mkrstudio/truefootball3/lab/**'
      - 'tests/p1_kotlin/**'
      - 'tools/verify_v4_p1_234.py'
      - 'tools/run_v4_p1_jvm_smoke.sh'

jobs:
  rust-and-kotlin-v4:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Kotlin compiler
        run: |
          curl -fsSL https://github.com/JetBrains/kotlin/releases/download/v1.9.25/kotlin-compiler-1.9.25.zip -o /tmp/kotlin.zip
          unzip -q /tmp/kotlin.zip -d /tmp/kotlin
          echo '/tmp/kotlin/kotlinc/bin' >> "$GITHUB_PATH"
      - name: Rust V4 and Kotlin P1 checks
        run: bash tools/validate_v4_p1_full.sh
