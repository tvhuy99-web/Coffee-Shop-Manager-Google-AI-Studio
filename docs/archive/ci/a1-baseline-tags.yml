name: A-1 preserve named baseline tags
on:
  push:
    branches: ['refactor/football-simulation-4']
    paths:
      - '.github/workflows/a1-baseline-tags.yml'
  workflow_dispatch:
permissions: {}
concurrency:
  group: pingfootball-baseline-tags
  cancel-in-progress: false
jobs:
  tags:
    if: github.repository == 'tvhuy99-web/Coffee-Shop-Manager-Google-AI-Studio' && github.ref == 'refs/heads/refactor/football-simulation-4'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/football-simulation-4
          fetch-depth: 0
      - name: Create only the two known baseline tags without force
        run: |
          set -euo pipefail
          for item in '4.0.27 1d7bf1b43a4384dff8b8ffbcb4953d18933e9393' '4.0.28 c2c392d8b3ccc57985e87337e8994fd7033328ee'; do
            read -r version sha <<< "$item"
            tag="pingfootball-baseline-pi-$version"
            git fetch origin "refs/heads/baseline/pi-$version"
            test "$(git rev-parse FETCH_HEAD)" = "$sha"
            if git show-ref --verify --quiet "refs/tags/$tag"; then
              test "$(git rev-parse "refs/tags/$tag^{commit}")" = "$sha"
            else
              git tag "$tag" "$sha"
              git push origin "refs/tags/$tag:refs/tags/$tag"
            fi
            test "$(git ls-remote --tags origin "refs/tags/$tag" | cut -f1)" = "$sha"
            echo "Verified $tag -> $sha"
          done
