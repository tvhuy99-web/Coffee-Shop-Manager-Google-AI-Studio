name: V4 P2 pre-merge Android ARM64 build

on:
  push:
    branches: ['integration/v4-p2-own-goals-stats']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: match-lab-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug-apk:
    name: Stable signed Debug APK with Rust ARM64
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install SDK, build tools and NDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.1" "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/27.2.12479018" >> "${GITHUB_ENV}"
          echo "ANDROID_NDK_ROOT=${ANDROID_HOME}/ndk/27.2.12479018" >> "${GITHUB_ENV}"

      - name: Set up Rust with Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Validate data, commentary and parity fixtures
        run: |
          python3 tools/verify_lab_v2.py
          python3 tools/verify_parity_fixtures.py

      - name: Run Rust tests
        working-directory: rust/football_match_engine
        run: cargo test --all-targets

      - name: Compile optimized Rust ARM64 library
        env:
          RUST_ANDROID_ABIS: arm64-v8a
        run: bash tools/build_lab_rust_android.sh

      - name: Build stable-key Debug APK
        run: bash gradlew :app:validateCommentaryTokens :app:assembleDebug --no-daemon --console plain

      - name: Verify APK signature, package, version and native engine
        env:
          EXPECTED_CERT_SHA256: d3ee2af5ec69b6b29fff105118bc66200070681fa9ee6124a5972761d7db45f1
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          mkdir -p build-evidence
          python3 - <<'PY'
          import zipfile
          apk = 'app/build/outputs/apk/debug/app-debug.apk'
          with zipfile.ZipFile(apk) as archive:
              corrupt = archive.testzip()
              if corrupt:
                  raise SystemExit('Corrupted APK entry: ' + corrupt)
              so = 'lib/arm64-v8a/libfootball_match_engine.so'
              if so not in archive.namelist():
                  raise SystemExit('Missing optimized Rust native library: ' + so)
              if not archive.read(so).startswith(b'\x7fELF'):
                  raise SystemExit('Rust native library is not ELF')
          PY
          "$ANDROID_HOME/build-tools/35.0.1/apksigner" verify --verbose --print-certs "$apk" | tee build-evidence/signature.txt
          badging="$("$ANDROID_HOME/build-tools/35.0.1/aapt" dump badging "$apk")"
          printf '%s\n' "$badging" | head -n 1 | tee build-evidence/package.txt
          printf '%s\n' "$badging" | grep -q "name='pl.mkrstudio.truefootball3.debug' versionCode='1' versionName='1.0-debug'"
          actual_cert="$(awk -F': ' '/certificate SHA-256 digest:/ {gsub(/:/, "", $NF); print tolower($NF); exit}' build-evidence/signature.txt)"
          test "$actual_cert" = "$EXPECTED_CERT_SHA256"
          sha256sum "$apk" | tee build-evidence/apk.sha256
          git rev-parse HEAD | tee build-evidence/commit.txt

      - name: Upload verified APK and build evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: football-match-lab-v1.0-stable-debug
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            build-evidence/*
          if-no-files-found: error
          retention-days: 30
